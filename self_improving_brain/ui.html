<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>self-improving-brain</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-150 -140 300 280'%3E%3Cpath d='M-92,-30 C-118,-92 -48,-128 -10,-104 C10,-140 88,-128 92,-74 C140,-62 140,8 104,26 C124,70 76,112 34,96 C10,128 -58,124 -70,86 C-124,84 -136,8 -92,-30 Z' fill='none' stroke='%237cf7d4' stroke-width='16' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{
  color-scheme:dark;
  --bg:#0b1020; --glass:rgba(11,16,32,.86); --panel:#0d1124; --raise:#141a38; --raise2:#1b2249;
  --line:#2b3366; --line-soft:#1e2550;
  --text:#e8ebff; --muted:#aab2e0; --faint:#7d86b8;
  --mint:#7cf7d4; --mint-ink:#7cf7d4; --mint-soft:rgba(124,247,212,.12); --mint-line:rgba(124,247,212,.38);
  --indigo:#8b9bff; --indigo-ink:#8b9bff; --indigo-soft:rgba(139,155,255,.15);
  --pink:#f08cff; --pink-ink:#f08cff; --pink-soft:rgba(240,140,255,.14);
  --amber:#ffd479; --amber-ink:#ffd479; --amber-soft:rgba(255,212,121,.12); --amber-line:rgba(255,212,121,.42);
  --neutral:#5a66ad;
  --btn-bg:#7cf7d4; --btn-fg:#06241c; --btn-hover:#a0fbe4;
  --focus:#8b9bff;
  --shadow:0 18px 50px -26px rgba(0,0,0,.75);
  --glow1:rgba(139,155,255,.13); --glow2:rgba(124,247,212,.07);
  --f0:#8b9bff; --f1:#f08cff; --f2:#ffd479; --f3:#6cc8ff; --f4:#b79cff; --f5:#ff9f8a; --f6:#d9c7a0;
  --sans:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
@media (prefers-color-scheme: light){
  :root{
    color-scheme:light;
    --bg:#f4f5fc; --glass:rgba(244,245,252,.88); --panel:#ffffff; --raise:#f0f2fc; --raise2:#e6e9fa;
    --line:#d2d7ee; --line-soft:#e3e6f6;
    --text:#131a3a; --muted:#444d82; --faint:#5d6599;
    --mint:#0ea583; --mint-ink:#0a755d; --mint-soft:rgba(14,165,131,.12); --mint-line:rgba(10,117,93,.35);
    --indigo:#5566e0; --indigo-ink:#3f4fc4; --indigo-soft:rgba(85,102,224,.11);
    --pink:#c04ad8; --pink-ink:#9a22b4; --pink-soft:rgba(192,74,216,.10);
    --amber:#c78500; --amber-ink:#8a5700; --amber-soft:rgba(199,133,0,.12); --amber-line:rgba(138,87,0,.4);
    --neutral:#8790c4;
    --btn-bg:#0a755d; --btn-fg:#ffffff; --btn-hover:#08604d;
    --focus:#3f4fc4;
    --shadow:0 14px 40px -28px rgba(30,40,100,.4);
    --glow1:rgba(85,102,224,.10); --glow2:rgba(14,165,131,.07);
    --f0:#5566e0; --f1:#b83fd0; --f2:#c78500; --f3:#1d87c9; --f4:#7a55d6; --f5:#d6573f; --f6:#7a6a3a;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:120px}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(900px 480px at 10% -12%,var(--glow1),transparent 62%),radial-gradient(760px 380px at 96% -8%,var(--glow2),transparent 62%)}
h1,h2,h3,h4,h5,h6,p,dl,dd,figure,ul,ol{margin:0}
code,.mono{font-family:var(--mono)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--indigo-ink)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:8px;background:var(--btn-bg);color:var(--btn-fg);padding:8px 12px;border-radius:8px;z-index:100;font-weight:600}
.skip:focus{left:12px}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}

/* header */
.top{position:sticky;top:0;z-index:30;background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line-soft)}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap;padding-top:14px}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.mark{width:34px;height:32px;flex:none}
.brand-name{font-size:17px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.meta{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;color:var(--muted);font-size:13px}
.vault{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.vault{max-width:min(46vw,360px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vault::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--mint)}
.ver{font-family:var(--mono);font-size:12.5px;color:var(--faint)}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.09em;border:1px solid var(--amber-line);color:var(--amber-ink);background:var(--amber-soft)}
.icon-btn{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
.icon-btn:hover{color:var(--text);background:var(--raise)}
.icon-btn svg,.btn svg{width:16px;height:16px;display:block}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:10px -4px 0;padding:0 4px}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:10px 14px 11px;cursor:pointer;font-weight:600;font-size:14.5px;white-space:nowrap;display:inline-flex;align-items:center;gap:8px;border-radius:8px 8px 0 0}
.tab:hover{color:var(--text)}
.tab[aria-selected="true"]{color:var(--text);border-bottom-color:var(--mint)}
.tab .count{font-size:11.5px;font-weight:700;padding:0 7px;border-radius:999px;background:var(--raise);color:var(--muted);line-height:1.7;font-variant-numeric:tabular-nums}
.tab .count.hot{background:var(--mint-soft);color:var(--mint-ink)}

main{padding:28px 0 72px;outline:none}
.view{animation:rise .22s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.stack-v{display:grid;gap:20px}
.banner{margin:16px 0 0;padding:12px 16px;border-radius:12px;border:1px solid var(--amber-line);background:var(--amber-soft);color:var(--text);display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner strong{color:var(--amber-ink)}

/* single-column grids must not grow with long nowrap content */
.lessons,.lesson,.groups,.rows,.rrow,.stack-v,.g-left,.g-right,.pack,.hand,.field,.tile{grid-template-columns:minmax(0,1fr)}

/* surfaces */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:var(--shadow);min-width:0}
.panel.tight{padding:18px 20px}
.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);font-weight:700}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.sec-title{font-size:20px;font-weight:700;letter-spacing:-.01em}
.sec-title em{font-style:normal;color:var(--mint-ink)}
.sec-sub{color:var(--muted);margin-top:4px}
.grid-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 24px;flex-wrap:wrap;margin-bottom:14px}

/* buttons, badges, chips */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--raise);color:var(--text);font-weight:600;font-size:14px;padding:8px 15px;border-radius:10px;cursor:pointer;transition:background .15s,border-color .15s}
.btn:hover:not(:disabled){background:var(--raise2)}
.btn.primary{background:var(--btn-bg);color:var(--btn-fg);border-color:transparent}
.btn.primary:hover:not(:disabled){background:var(--btn-hover)}
.btn.warn{border-color:var(--amber-line);color:var(--amber-ink);background:var(--amber-soft)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 11px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.42;cursor:not-allowed}
.linkbtn{appearance:none;background:none;border:0;padding:0;color:var(--indigo-ink);cursor:pointer;font-weight:600;text-decoration:underline;text-decoration-color:transparent;text-underline-offset:3px;display:inline-flex;align-items:center;gap:5px}
.linkbtn:hover{text-decoration-color:currentColor}
.linkbtn svg{width:13px;height:13px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:1px 10px;border-radius:999px;font-size:12px;font-weight:700;line-height:1.7;border:1px solid transparent;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.9}
.badge.nodot::before{display:none}
.b-always{background:var(--indigo-soft);color:var(--indigo-ink)}
.b-reflex{background:var(--mint-soft);color:var(--mint-ink)}
.b-guard{background:var(--amber-soft);color:var(--amber-ink)}
.b-skill{background:var(--pink-soft);color:var(--pink-ink)}
.b-x{background:var(--raise);color:var(--muted)}
.b-caught{background:var(--mint-soft);color:var(--mint-ink)}
.b-missed{background:var(--amber-soft);color:var(--amber-ink)}
.b-uncovered{background:var(--raise);color:var(--muted)}
.b-silent{background:var(--amber-soft);color:var(--amber-ink);border-color:var(--amber-line)}
.b-ok{background:var(--mint-soft);color:var(--mint-ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{appearance:none;display:inline-flex;align-items:baseline;gap:7px;max-width:100%;font:12.5px/1.45 var(--mono);padding:3px 9px;border-radius:8px;background:var(--raise);border:1px solid var(--line-soft);color:var(--text);text-align:left;cursor:default}
button.chip{cursor:pointer}
.chip i{font-style:normal;font-family:var(--sans);font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);flex:none}
.chip .v{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.open .v{white-space:normal;overflow-wrap:anywhere}
.chip.pill-chip{font-family:var(--sans);font-size:13px;padding:5px 12px;border-radius:999px;cursor:pointer;color:var(--muted);font-weight:600}
.chip.pill-chip[aria-pressed="true"]{background:var(--mint-soft);border-color:var(--mint-line);color:var(--mint-ink)}
.chip.pill-chip:hover{color:var(--text)}
.chip.pill-chip .n{font-weight:700;color:var(--faint);font-variant-numeric:tabular-nums}
.cmd{display:flex;align-items:center;gap:8px;min-width:0;background:var(--raise);border:1px solid var(--line-soft);border-radius:10px;padding:5px 6px 5px 12px}
.cmd code{flex:1;min-width:0;font-size:12.5px;overflow:auto;white-space:nowrap;scrollbar-width:none;padding:3px 0}
.cmd code::-webkit-scrollbar{display:none}
.copy{appearance:none;flex:none;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:7px;padding:3px 10px;font-size:12px;font-weight:600;cursor:pointer;min-width:62px}
.copy:hover{color:var(--text)}
code.i{font-size:.92em;background:var(--raise);border:1px solid var(--line-soft);padding:1px 6px;border-radius:6px}

/* overview */
.hero{padding:28px 28px 20px;overflow:hidden}
.hero-head{display:flex;justify-content:space-between;gap:20px 40px;flex-wrap:wrap;align-items:flex-end}
.big{font-size:clamp(64px,15vw,112px);line-height:.95;font-weight:750;letter-spacing:-.045em;margin:10px 0 12px;color:var(--mint-ink)}
.big.up{color:var(--amber-ink)} .big.flat{color:var(--text)}
.hero-text{font-size:18px;color:var(--text);max-width:46ch}
.nw{white-space:nowrap}
.hero-text .faint{display:block;font-size:14.5px;margin-top:4px;color:var(--muted)}
.facts{display:flex;gap:28px;flex-wrap:wrap}
@media (max-width:720px){.facts{width:100%;gap:16px}.fact{flex:1 1 42%}.fact b{font-size:26px}}
.fact .eyebrow{display:block;margin-bottom:3px}
.fact b{font-size:30px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.fact b small{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:0;margin-left:5px}
.fact span.s{display:block;font-size:13px;color:var(--muted)}
.chart{position:relative;margin-top:18px;border-radius:12px}
.chart svg{display:block;max-width:none}
.chart:focus-visible{outline-offset:4px}
.g-line{stroke:var(--line-soft);stroke-width:1;shape-rendering:crispEdges}
.g-axis{fill:var(--faint);font-size:11.5px;font-family:var(--sans)}
.g-val{fill:var(--text);font-size:13px;font-weight:700;font-family:var(--sans)}
.g-val.m{fill:var(--muted);font-weight:600}
.curve-line{fill:none;stroke:var(--mint);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.draw .curve-line{stroke-dasharray:1;stroke-dashoffset:1;animation:dash 1s cubic-bezier(.3,.6,.2,1) .15s forwards}
.draw .curve-area{opacity:0;animation:fadein .8s ease-out .5s forwards}
@keyframes dash{to{stroke-dashoffset:0}}
@keyframes fadein{to{opacity:1}}
.cross{stroke:var(--faint);stroke-width:1;stroke-dasharray:3 3}
.tip{position:absolute;z-index:5;pointer-events:none;transform:translateX(-50%);background:var(--raise2);border:1px solid var(--line);border-radius:10px;padding:8px 11px;font-size:13px;box-shadow:var(--shadow);white-space:nowrap;line-height:1.4}
.tip b{display:block;font-size:13px}
.tip .m{color:var(--muted);font-size:12.5px}
.tip .k{font-variant-numeric:tabular-nums}

.replay-sum{padding:26px 28px}
.replay-sum h2{font-size:clamp(20px,3.2vw,26px);line-height:1.25;font-weight:700;letter-spacing:-.015em;max-width:62ch}
.replay-sum h2 em{font-style:normal;color:var(--mint-ink)}
.replay-sum h2 .by,.sec-title .by{color:var(--muted);font-weight:600;display:inline-block}
.expl{color:var(--muted);font-size:14px;margin-top:8px;max-width:70ch}
.expl b{color:var(--text)}
.stackbar{display:flex;gap:2px;height:14px;margin:18px 0 12px;border-radius:7px;overflow:hidden}
.stackbar span{display:block;min-width:3px;background:var(--c)}
.stackbar span:first-child{border-radius:7px 3px 3px 7px}
.stackbar span:last-child{border-radius:3px 7px 7px 3px}
.stackbar span:only-child{border-radius:7px}
.legend{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:13.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:8px}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--c);flex:none}
.legend b{color:var(--text);font-variant-numeric:tabular-nums}
.c-caught{--c:var(--mint)} .c-missed{--c:var(--amber)} .c-uncovered{--c:var(--neutral)}
.row-end{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px}

.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
.tile{display:flex;flex-direction:column;gap:6px;padding:20px 22px}
.tile .val{font-size:44px;font-weight:700;letter-spacing:-.035em;line-height:1.05;margin-top:6px;font-variant-numeric:normal}
.tile .val small{font-size:15px;font-weight:600;color:var(--muted);letter-spacing:0;margin-left:6px}
.tile .sub{color:var(--muted);font-size:13.5px}
.tile .vis{margin-top:auto;padding-top:14px}
.mix{display:flex;gap:2px;height:8px}
.mix span{flex:var(--n) 1 0;background:var(--c);border-radius:4px;min-width:3px}
.mixlist{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:10px;font-size:13px}
.mixlist button{appearance:none;background:none;border:0;padding:2px 0;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;gap:6px;border-radius:6px}
.mixlist button:hover{color:var(--text)}
.mixlist i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.mixlist b{color:var(--text)}
.m-always{--c:var(--indigo)} .m-reflex{--c:var(--mint)} .m-guard{--c:var(--amber)} .m-skill{--c:var(--pink)} .m-x{--c:var(--neutral)}
.meter{height:8px;border-radius:4px;background:var(--raise2);overflow:hidden}
.meter span{display:block;height:100%;background:var(--mint);border-radius:4px}
.checks-chart{position:relative}
.onboard{text-align:center;padding:48px 24px}
.onboard h2{font-size:24px;letter-spacing:-.02em}
.onboard p{color:var(--muted);margin:8px auto 18px;max-width:46ch}
.onboard .cmd{max-width:300px;margin:0 auto}

/* lessons */
.toolbar{display:flex;gap:12px 16px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar .chips{flex:1 1 320px}
.search{position:relative;flex:0 1 300px;min-width:200px;width:100%;max-width:340px}
.search input,.field input,.field textarea,.field select,.gsearch input{width:100%;background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:var(--text);outline-offset:2px}
.search input{padding-left:34px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--faint);pointer-events:none}
input::placeholder,textarea::placeholder{color:var(--faint);opacity:1}
.count-line{color:var(--muted);font-size:13.5px;margin:0 0 12px}
.lessons{display:grid;gap:12px}
.lesson{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 20px;display:grid;gap:11px;min-width:0}
.lesson.flag{border-color:var(--amber-line)}
.l-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.lid{font-family:var(--mono);font-size:13.5px;font-weight:700;overflow-wrap:anywhere}
.since{margin-left:auto;color:var(--faint);font-size:12.5px}
.rule{font-size:16px;line-height:1.5;overflow-wrap:anywhere;max-width:80ch}
.l-foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 24px;padding-top:11px;border-top:1px solid var(--line-soft)}
.health{display:flex;gap:6px 20px;flex-wrap:wrap}
.stat{display:flex;align-items:baseline;gap:6px;font-size:13px;color:var(--muted)}
.stat b{font-size:15px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
.stat.bad b{color:var(--amber-ink)}
.stat b.d{font-size:13px;font-weight:600;color:var(--muted)}
.verdict{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:11px;background:var(--amber-soft);border:1px solid var(--amber-line);font-size:14px;flex-wrap:wrap}
.verdict svg{width:16px;height:16px;flex:none;color:var(--amber-ink);margin-top:3px}
.verdict .t{flex:1 1 240px;min-width:0;overflow-wrap:anywhere}
.verdict .t b{color:var(--amber-ink)}
.verdict .cmd{flex:1 1 100%;background:var(--panel)}
.silent{display:flex;gap:12px 16px;flex-wrap:wrap;align-items:center;padding:12px 14px;border-radius:12px;background:var(--amber-soft);border:1px solid var(--amber-line)}
.silent .t{flex:1 1 260px;min-width:0;font-size:14px;overflow-wrap:anywhere}
.silent .t b{display:flex;gap:7px;align-items:center;color:var(--amber-ink);margin-bottom:2px}
.silent .t svg{width:16px;height:16px}
.silent .acts{display:flex;gap:8px;flex-wrap:wrap}
.empty{padding:40px 24px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px}
.empty h3{color:var(--text);font-size:18px;margin-bottom:6px}

/* review */
.promise{display:flex;gap:14px;align-items:flex-start}
.promise svg{width:22px;height:22px;flex:none;color:var(--mint-ink);margin-top:2px}
.promise p{max-width:70ch}
.groups{display:grid;gap:16px;margin-top:20px}
.group{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:22px 32px;box-shadow:var(--shadow)}
.g-left{display:grid;gap:14px;align-content:start;min-width:0}
.g-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.quote{border-left:3px solid var(--indigo);padding:2px 0 2px 13px;font-size:15.5px;overflow-wrap:anywhere}
.quote + .quote{margin-top:10px}
.quote .q-meta{display:block;font-size:12.5px;color:var(--faint);margin-top:3px}
.q-label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:700;margin-bottom:7px;display:block}
.ctx{font:12.5px/1.5 var(--mono);background:var(--raise);border:1px solid var(--line-soft);border-radius:9px;padding:7px 10px;overflow-wrap:anywhere;white-space:pre-wrap;color:var(--muted)}
.ctx + .ctx{margin-top:6px}
.g-right{display:grid;gap:14px;align-content:start;background:var(--raise);border-radius:14px;padding:16px;min-width:0;border:1px solid var(--line-soft)}
.field{display:grid;gap:6px;min-width:0}
.field label{font-size:13px;font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.field label .tag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mint-ink);background:var(--mint-soft);padding:0 8px;border-radius:999px}
.field .hint{font-size:12.5px;color:var(--muted)}
.field textarea{min-height:84px;resize:vertical;line-height:1.5;background:var(--panel)}
.field input,.field select{background:var(--panel)}
.field-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.acts{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.err{color:var(--amber-ink);font-size:14px;padding:8px 12px;border-radius:9px;background:var(--amber-soft);border:1px solid var(--amber-line);overflow-wrap:anywhere}
.done{grid-column:1/-1;display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between;color:var(--muted)}
.done b{color:var(--mint-ink)}

/* replay */
.run{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.run select{background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--text)}
.progress{height:4px;border-radius:2px;background:var(--raise2);overflow:hidden;margin-top:14px;position:relative}
.progress::after{content:"";position:absolute;inset:0 auto 0 0;width:30%;background:var(--mint);border-radius:2px;animation:slide 1.1s ease-in-out infinite}
@keyframes slide{0%{left:-30%}100%{left:100%}}
.statrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:20px}
.sbox{border:1px solid var(--line-soft);border-radius:14px;padding:14px 16px;background:var(--raise);min-width:0}
.sbox b{display:block;font-size:30px;letter-spacing:-.03em;line-height:1.1;margin:2px 0 4px;font-variant-numeric:tabular-nums}
.sbox span{font-size:13px;color:var(--muted);display:block}
.sbox .eyebrow{display:flex;align-items:center;gap:7px}
.sbox .eyebrow i{width:8px;height:8px;border-radius:2px;background:var(--c)}
.metaline{color:var(--faint);font-size:13px;margin-top:14px}
table.rt{width:100%;border-collapse:collapse;font-size:14px}
.rt th{text-align:left;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);font-weight:700;padding:0 12px 10px 0;border-bottom:1px solid var(--line-soft)}
.rt td{padding:11px 12px 11px 0;border-bottom:1px solid var(--line-soft);vertical-align:top}
.rt tr:last-child td{border-bottom:0}
.rt .n{font-variant-numeric:tabular-nums;font-weight:700}
.rt .id{font-family:var(--mono);font-size:13px;overflow-wrap:anywhere}
.rows{display:grid;gap:10px;margin-top:6px}
.rrow{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:8px;min-width:0}
.r-top{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap;font-size:13px;color:var(--faint)}
.r-top .d{font-family:var(--mono);margin-left:auto}
.r-quote{font-size:15px;overflow-wrap:anywhere}
.r-fire{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:13px;color:var(--muted);align-items:center}
.r-fire .f{display:inline-flex;gap:7px;align-items:baseline}
.r-fire code{font-size:12.5px;color:var(--text)}
.note-tag{font-size:12.5px;color:var(--faint)}
.more-row{text-align:center;margin-top:14px}

/* graph */
.graph-wrap{position:relative;height:clamp(440px,calc(100vh - 210px),780px);border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--panel);box-shadow:var(--shadow)}
.gsvg{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.gsvg:active{cursor:grabbing}
.gsvg .edges{fill:none;stroke:var(--faint);stroke-width:1;stroke-opacity:.38;vector-effect:non-scaling-stroke}
.gsvg .edges-hi{fill:none;stroke:var(--mint);stroke-width:1.6;stroke-opacity:.9;vector-effect:non-scaling-stroke}
.node{cursor:pointer;transition:opacity .15s}
.node .dot{fill:var(--c);stroke:var(--panel);stroke-width:1.5;vector-effect:non-scaling-stroke}
.node .halo{fill:var(--c);opacity:.14}
.node .ring{fill:none;stroke:var(--mint);stroke-width:2.2;vector-effect:non-scaling-stroke}
.node .hit{fill:transparent}
.node .lbl{font-size:calc(11.5px / var(--k,1));fill:var(--text);paint-order:stroke;stroke:var(--panel);stroke-width:calc(3.5px / var(--k,1));stroke-linejoin:round;pointer-events:none;font-family:var(--sans);font-weight:600}
.node.hub .lbl{font-size:calc(13px / var(--k,1));font-weight:700}
.gsvg:not(.labels-all) .node:not(.hub):not(.hl) .lbl{display:none}
.node.dim,.node.fade{opacity:.17}
.node.pick .dot{stroke:var(--text);stroke-width:2}
.f0{--c:var(--f0)}.f1{--c:var(--f1)}.f2{--c:var(--f2)}.f3{--c:var(--f3)}.f4{--c:var(--f4)}.f5{--c:var(--f5)}.f6{--c:var(--f6)}
.gsvg.hov .edges{stroke-opacity:.12}
.g-ctl{position:absolute;top:12px;right:12px;display:grid;gap:6px}
.g-ctl .icon-btn{background:var(--glass);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.gsearch{position:absolute;top:12px;left:12px;right:60px;max-width:300px}
.gsearch input{background:var(--glass);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.gsearch .res{font-size:12px;color:var(--muted);margin:4px 2px 0;text-shadow:0 0 6px var(--panel)}
.g-legend{position:absolute;left:12px;bottom:12px;right:12px;display:flex;gap:4px 14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);align-items:center;pointer-events:none}
.g-legend>*{pointer-events:auto}
.g-legend .lg{appearance:none;background:var(--glass);border:1px solid var(--line-soft);border-radius:999px;padding:2px 10px 2px 8px;color:var(--muted);cursor:pointer;display:inline-flex;gap:7px;align-items:center;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.g-legend .lg i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.g-legend .lg[aria-pressed="true"]{border-color:var(--mint-line);color:var(--text)}
.g-legend .lg.ring i{background:transparent;border:2px solid var(--mint)}
.g-legend .lg.ring{cursor:default}
.g-hint{position:absolute;top:22px;left:340px;right:64px;font-size:12px;color:var(--faint);pointer-events:none;text-align:right}
@media (max-width:1000px){.g-hint{display:none}}
.gtip{position:absolute;z-index:6;max-width:260px;pointer-events:none;background:var(--raise2);border:1px solid var(--line);border-radius:10px;padding:8px 11px;font-size:13px;box-shadow:var(--shadow)}
.gtip b{display:block;font-family:var(--mono);font-size:12.5px}
.gtip span{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}

/* more */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.pack{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 20px;display:grid;gap:9px;align-content:start;min-width:0}
.pack.on{border-color:var(--mint-line)}
.pack h3{font-size:16px;font-family:var(--mono);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pack p{color:var(--muted);font-size:14px}
.pack .ln{font-size:13px;color:var(--faint)}
.hand{display:grid;gap:0}
.hrow{display:grid;grid-template-columns:150px 90px minmax(0,1fr) minmax(0,1.4fr);gap:8px 18px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line-soft)}
.hrow:last-child{border-bottom:0}
.hrow .t{font-family:var(--mono);font-size:13px;color:var(--muted)}
.hrow .repo{font-weight:700;overflow-wrap:anywhere}
.hrow .sess{font-family:var(--mono);font-size:12px;color:var(--faint);overflow-wrap:anywhere;display:block;font-weight:400}
dl.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:9px 28px}
dl.kv dt{color:var(--muted)}
dl.kv dd{font-weight:600;overflow-wrap:anywhere}
dl.kv dd.mono{font-weight:500;font-size:13.5px}

/* note panel */
.note-backdrop{position:fixed;inset:0;z-index:48;background:rgba(5,8,20,.55)}
.note{position:fixed;z-index:50;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--panel);border-left:1px solid var(--line);box-shadow:-24px 0 60px -30px rgba(0,0,0,.65);display:flex;flex-direction:column;animation:slidein .2s ease-out both}
@keyframes slidein{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
.note-bar{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line-soft)}
.note-bar h2{flex:1;min-width:0;font-size:16px;font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note-body{overflow:auto;padding:20px 22px 40px;flex:1;overscroll-behavior:contain}
.note-meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.note-meta .rel{font-size:12.5px;color:var(--faint);overflow-wrap:anywhere}
.note-desc{color:var(--muted);margin-bottom:14px}
@media (min-width:900px){ .note-backdrop{display:none!important} }

/* markdown */
.md{font-size:15px;line-height:1.65;overflow-wrap:anywhere}
.md>*+*{margin-top:12px}
.md h3,.md h4,.md h5,.md h6{line-height:1.3;letter-spacing:-.01em;margin-top:22px}
.md h3{font-size:21px}.md h4{font-size:17.5px}.md h5{font-size:15.5px}.md h6{font-size:14px;color:var(--muted)}
.md ul,.md ol{padding-left:22px}
.md li+li{margin-top:4px}
.md li>ul,.md li>ol{margin-top:4px}
.md code{font-family:var(--mono);font-size:.9em;background:var(--raise);border:1px solid var(--line-soft);padding:1px 6px;border-radius:6px}
.md pre{background:var(--raise);border:1px solid var(--line-soft);border-radius:12px;padding:12px 14px;overflow:auto;font-size:13px;line-height:1.55}
.md pre code{background:none;border:0;padding:0;font-size:inherit;white-space:pre}
.md blockquote{margin-left:0;padding:2px 0 2px 14px;border-left:3px solid var(--line);color:var(--muted)}
.md hr{border:0;border-top:1px solid var(--line-soft);margin:20px 0}
.md a{color:var(--indigo-ink)}
.wikilink{appearance:none;background:none;border:0;padding:0;font:inherit;color:var(--indigo-ink);cursor:pointer;text-decoration:underline;text-decoration-color:var(--indigo-soft);text-decoration-thickness:2px;text-underline-offset:3px}
.wikilink:hover{text-decoration-color:currentColor}
.wikilink.miss{text-decoration-style:dashed;color:var(--muted)}
.tablewrap{overflow-x:auto;border:1px solid var(--line-soft);border-radius:12px}
.md table{border-collapse:collapse;font-size:14px;min-width:100%}
.md th,.md td{padding:8px 12px;border-bottom:1px solid var(--line-soft);text-align:left;vertical-align:top}
.md th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.md tr:last-child td{border-bottom:0}
.lcard{border:1px solid var(--line);border-left:3px solid var(--mint);border-radius:12px;background:var(--raise);padding:12px 14px;display:grid;gap:8px}
.lcard .lc-head{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap}
.lcard .lc-head code{background:none;border:0;padding:0;font-weight:700;font-size:13px}
.lcard .lc-rule{font-size:15px;color:var(--text)}
.lcard .lc-since{margin-left:auto;font-size:12.5px;color:var(--faint)}
.callout{border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--raise)}
.callout .co-title{font-weight:700;margin-bottom:4px}

/* auth + toast */
.auth{max-width:560px;margin:12vh auto 0;text-align:center;padding:36px 28px}
.auth h1{font-size:22px;line-height:1.35}
.auth p{color:var(--muted);margin-top:10px}
.toasts{position:fixed;z-index:90;left:50%;bottom:18px;transform:translateX(-50%);display:grid;gap:8px;width:min(520px,calc(100vw - 32px));pointer-events:none}
.toast{pointer-events:auto;background:var(--raise2);border:1px solid var(--line);border-radius:12px;padding:11px 15px;box-shadow:var(--shadow);font-size:14px;animation:rise .2s ease-out both;overflow-wrap:anywhere}
.toast.ok{border-color:var(--mint-line)}
.toast.err{border-color:var(--amber-line)}
.loading{color:var(--muted);padding:40px 0;text-align:center}

@media (max-width:1020px){
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .group{grid-template-columns:minmax(0,1fr)}
  .statrow{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:720px){
  main{padding-top:20px}
  .panel{padding:18px;border-radius:16px}
  .hero{padding:20px 18px 14px}
  .tiles{grid-template-columns:minmax(0,1fr);gap:14px}
  .stack-v{gap:14px}
  .field-row{grid-template-columns:minmax(0,1fr)}
  .group{padding:16px}
  .hrow{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .hrow .cmd{grid-column:1/-1}
  .since{margin-left:0;width:100%}
  .lesson{padding:15px}
  .search{max-width:none;flex-basis:100%}
  .brand-name{font-size:16px}
  .rt thead{display:none}
  .rt,.rt tbody,.rt tr,.rt td{display:block;width:100%}
  .rt tr{padding:12px 0;border-bottom:1px solid var(--line-soft)}
  .rt tr:last-child{border-bottom:0}
  .rt td{border:0;padding:3px 0;display:flex;gap:12px;justify-content:space-between;align-items:baseline}
  .rt td::before{content:attr(data-label);color:var(--faint);font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;flex:none}
  .rt td.first{display:block}
  .rt td.first::before{display:none}
  .g-hint{display:none}
  .graph-wrap{height:calc(100vh - 230px);min-height:420px}
  dl.kv{grid-template-columns:minmax(0,1fr);gap:2px}
  dl.kv dd{margin-bottom:10px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition:none!important}
  .draw .curve-line{stroke-dashoffset:0}
  .draw .curve-area{opacity:1}
  .progress::after{animation:none;left:0;width:100%;opacity:.5}
}

function niceMax(vmax){
  var steps=[1,2,5],p=0.1;
  for(var pass=0;pass<8;pass++){
    for(var i=0;i<3;i++){
      var st=steps[i]*p,top=Math.ceil(vmax/st-1e-9)*st;
      if(top/st<=5)return{step:st,top:top};
    }
    p*=10;
  }
  return{step:vmax,top:vmax};
}
function monotonePath(pts){
  var n=pts.length;
  if(n<2)return'';
  var dx=[],dy=[],m=[],i;
  for(i=0;i<n-1;i++){dx.push(pts[i+1][0]-pts[i][0]);dy.push((pts[i+1][1]-pts[i][1])/(pts[i+1][0]-pts[i][0]))}
  m[0]=dy[0];m[n-1]=dy[n-2];
  for(i=1;i<n-1;i++)m[i]=dy[i-1]*dy[i]<=0?0:(dy[i-1]+dy[i])/2;
  for(i=0;i<n-1;i++){
    if(dy[i]===0){m[i]=0;m[i+1]=0;continue}
    var a=m[i]/dy[i],b=m[i+1]/dy[i],q=a*a+b*b;
    if(q>9){var t=3/Math.sqrt(q);m[i]=t*a*dy[i];m[i+1]=t*b*dy[i]}
  }
  var d='M'+pts[0][0].toFixed(1)+','+pts[0][1].toFixed(1);
  for(i=0;i<n-1;i++){
    var x0=pts[i][0],y0=pts[i][1],x1=pts[i+1][0],y1=pts[i+1][1],w=dx[i]/3;
    d+=' C'+(x0+w).toFixed(1)+','+(y0+m[i]*w).toFixed(1)+' '+(x1-w).toFixed(1)+','+(y1-m[i+1]*w).toFixed(1)+' '+x1.toFixed(1)+','+y1.toFixed(1);
  }

}

    h('button',{class:'icon-btn',type:'button','aria-label':'Fit graph to view',title:'Fit to view',onclick:function(){G.touched=false;fitView()}},icon('fit')));
  var legend=h('div',{class:'g-legend'});
  folders.forEach(function(f,i){
    var cnt=nodes.filter(function(n){return n.folder===f}).length,ci=fidx.get(f);
    legend.appendChild(h('button',{class:'lg f'+ci,type:'button','aria-pressed':'false',title:'Highlight '+(f||'root')+' notes',onclick:function(e){
      var b=e.currentTarget,on=b.getAttribute('aria-pressed')!=='true';
      Array.prototype.forEach.call(legend.querySelectorAll('.lg[aria-pressed]'),function(x){x.setAttribute('aria-pressed','false')});
      b.setAttribute('aria-pressed',on?'true':'false');G.folder=on?f:null;paintClasses();
    }},h('i'),(f||'(root)')+' · '+cnt));
  });
  if(nodes.some(function(n){return n.lessons>0}))legend.appendChild(h('span',{class:'lg ring'},h('i'),'holds lessons'));
  wrap.appendChild(svg);wrap.appendChild(h('div',{class:'gsearch'},search,res));wrap.appendChild(ctl);wrap.appendChild(legend);
  wrap.appendChild(h('div',{class:'g-hint',text:'Drag to pan · scroll to zoom · click a note'}));wrap.appendChild(gtip);
  root.appendChild(wrap);
  G.svg=svg;G.vp=vp;G.wrap=wrap;G.edges=edges;G.edgesHi=edgesHi;

  function size(){var r=wrap.getBoundingClientRect();return{w:r.width||800,h:r.height||500}}
  function applyView(){
    var v=G.view;vp.setAttribute('transform','translate('+v.x.toFixed(2)+' '+v.y.toFixed(2)+') scale('+v.k.toFixed(4)+')');
    svg.style.setProperty('--k',v.k.toFixed(3));
    svg.classList.toggle('labels-all',v.k>=1.5||N<=60);
  }
  G.applyView=applyView;
  function fitView(){
    if(!nodes.length)return;var sz=size(),minx=1e9,maxx=-1e9,miny=1e9,maxy=-1e9;
    nodes.forEach(function(n){minx=Math.min(minx,n.x-n.r);maxx=Math.max(maxx,n.x+n.r);miny=Math.min(miny,n.y-n.r);maxy=Math.max(maxy,n.y+n.r)});
    var topPad=58,botPad=(legend.offsetHeight||36)+22,availH=Math.max(120,sz.h-topPad-botPad);
    var bw=maxx-minx+90,bh=maxy-miny+70;
    var k=clamp(Math.min(sz.w/bw,availH/bh),0.12,N<=30?2.2:1.2);
    G.view={k:k,x:sz.w/2-(minx+maxx)/2*k,y:topPad+availH/2-(miny+maxy)/2*k};applyView();
  }
  window.fitView=fitView;
  function zoomAt(cx,cy,f,center){
    var r=svg.getBoundingClientRect(),px=center?r.width/2:cx-r.left,py=center?r.height/2:cy-r.top,v=G.view;
    var k=clamp(v.k*f,0.1,8),wx=(px-v.x)/v.k,wy=(py-v.y)/v.k;G.view={k:k,x:px-wx*k,y:py-wy*k};G.touched=true;applyView();
  }
  function toWorld(e){var r=svg.getBoundingClientRect(),v=G.view;return{x:(e.clientX-r.left-v.x)/v.k,y:(e.clientY-r.top-v.y)/v.k}}
  function render(){
    var d='';
    for(var i=0;i<links.length;i++){var l=links[i];d+='M'+l.s.x.toFixed(1)+' '+l.s.y.toFixed(1)+'L'+l.t.x.toFixed(1)+' '+l.t.y.toFixed(1)}
    edges.setAttribute('d',d);
    for(var j=0;j<nodes.length;j++){var n=nodes[j];n.el.setAttribute('transform','translate('+n.x.toFixed(1)+' '+n.y.toFixed(1)+')')}
    if(G.hover)paintEdgesHi();
  }
  function paintEdgesHi(){
    var n=G.hover,d='';
    if(n)links.forEach(function(l){if(l.s===n||l.t===n)d+='M'+l.s.x.toFixed(1)+' '+l.s.y.toFixed(1)+'L'+l.t.x.toFixed(1)+' '+l.t.y.toFixed(1)});
    edgesHi.setAttribute('d',d);
  }
  function paintClasses(){
    var q=G.q.trim().toLowerCase(),hv=G.hover;
    nodes.forEach(function(n){
      var match=!q||n.id.toLowerCase().indexOf(q)>=0||n.desc.toLowerCase().indexOf(q)>=0;
      var dim=!match||(G.folder!==null&&n.folder!==G.folder);
      var fade=hv&&n!==hv&&!hv.nb.has(n);
      n.el.classList.toggle('dim',!!dim);n.el.classList.toggle('fade',!!fade&&!dim);
      n.el.classList.toggle('hl',!!hv&&(n===hv||hv.nb.has(n)));
    });
    svg.classList.toggle('hov',!!hv);
  }
  function setHover(n,e){
    if(G.hover!==n){G.hover=n;paintClasses();paintEdgesHi()}
    if(!n){gtip.hidden=true;return}
    clear(gtip);gtip.appendChild(h('b',{text:n.id}));
    gtip.appendChild(h('span',{text:[n.folder||'(root)',n.type,n.lessons?plural(n.lessons,'lesson'):'',plural(n.deg,'link')].filter(Boolean).join(' · ')}));
    if(n.desc)gtip.appendChild(h('span',{text:n.desc.length>150?n.desc.slice(0,147)+'…':n.desc}));
    gtip.hidden=false;var r=wrap.getBoundingClientRect(),w=gtip.offsetWidth,hh=gtip.offsetHeight;
    gtip.style.left=clamp(e.clientX-r.left+14,8,r.width-w-8)+'px';gtip.style.top=clamp(e.clientY-r.top+16,8,r.height-hh-8)+'px';
  }

  /* --- force simulation --- */
  var sim={alpha:1,raf:0,running:false};G.sim=sim;
  if(reused>N/2)sim.alpha=0.3;
  var SC=N<=40?1.8:N<=150?1.3:1,REP=170*SC*SC;
  function tick(alpha){
    var i,j,a,b,dx,dy,d2,w,fx,fy;
    for(i=0;i<N;i++){
      a=nodes[i];
      for(j=i+1;j<N;j++){
        b=nodes[j];dx=b.x-a.x;dy=b.y-a.y;d2=dx*dx+dy*dy;
        if(d2>250000)continue;
        if(d2<1){dx=(i-j)*.07;dy=(j-i)*.05+.03;d2=dx*dx+dy*dy+.5}
        w=REP*alpha/d2;fx=dx*w;fy=dy*w;a.vx-=fx;a.vy-=fy;b.vx+=fx;b.vy+=fy;
        var md=a.r+b.r+16;
        if(d2<md*md){var dd=Math.sqrt(d2)||1,cc=(md-dd)/dd*0.3;a.vx-=dx*cc;a.vy-=dy*cc;b.vx+=dx*cc;b.vy+=dy*cc}
      }
    }
    for(i=0;i<links.length;i++){
      var l=links[i],s0=l.s,t0=l.t;
      dx=t0.x+t0.vx-s0.x-s0.vx;dy=t0.y+t0.vy-s0.y-s0.vy;
      var d=Math.sqrt(dx*dx+dy*dy)||1,dist=((s0.hub||t0.hub)?95:62)*SC,kk=(d-dist)/d*alpha*l.k;
      dx*=kk;dy*=kk;var bb=s0.deg/(s0.deg+t0.deg);
      t0.vx-=dx*bb;t0.vy-=dy*bb;s0.vx+=dx*(1-bb);s0.vy+=dy*(1-bb);
    }
    var gk=0.05*alpha;
    for(i=0;i<N;i++){
      a=nodes[i];a.vx-=a.x*gk;a.vy-=a.y*gk;
      if(a.fx!=null){a.x=a.fx;a.y=a.fy;a.vx=0;a.vy=0}else{a.vx*=0.6;a.vy*=0.6;a.x+=a.vx;a.y+=a.vy}
    }
  }
  function step(){sim.alpha+=(0-sim.alpha)*0.0228;tick(sim.alpha)}
  function frame(){
    sim.raf=0;var per=N<=200?3:N<=500?2:1;
    for(var k=0;k<per;k++)step();
    render();
    if(sim.alpha>0.004){sim.raf=requestAnimationFrame(frame)}
    else{sim.running=false;if(!G.touched)fitView()}
  }
  function start(){if(sim.running)return;sim.running=true;sim.raf=requestAnimationFrame(frame)}
  function reheat(a){sim.alpha=Math.max(sim.alpha,a);start()}
  G.reheat=reheat;
  var pre=reused>N/2?0:(N<=150?170:N<=400?70:25);
  var t0=performance.now();
  if(REDUCED){while(sim.alpha>0.004&&performance.now()-t0<900)step();render();fitView()}
  else{for(var pi=0;pi<pre;pi++)step();render();fitView();start()}
  applyView();

  /* --- pointer: pan, drag node, pinch, click --- */
  var ptrs=new Map(),mode=null,moved=false,down=null,startPt=null,pinch=null;
  svg.addEventListener('pointerdown',function(e){
    if(e.pointerType==='mouse'&&e.button!==0)return;
    try{svg.setPointerCapture(e.pointerId)}catch(_){}
    ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    gtip.hidden=true;
    if(ptrs.size===2){
      var pts=Array.from(ptrs.values());mode='pinch';moved=true;down=null;
      pinch={d:Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y)||1,k:G.view.k,x:G.view.x,y:G.view.y,cx:(pts[0].x+pts[1].x)/2,cy:(pts[0].y+pts[1].y)/2};return;
    }
    if(ptrs.size>2)return;
    moved=false;startPt={x:e.clientX,y:e.clientY};
    var el=e.target.closest&&e.target.closest('.node');down=el?el.__n:null;
    mode=(down&&e.pointerType==='mouse')?'node':'pan';
  });
  svg.addEventListener('pointermove',function(e){
    var p=ptrs.get(e.pointerId);
    if(!p){if(e.pointerType==='mouse'){var el=e.target.closest&&e.target.closest('.node');setHover(el?el.__n:null,e)}return}
    if(mode==='pinch'&&ptrs.size===2){
      ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
      var pts=Array.from(ptrs.values()),d=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y)||1,r=svg.getBoundingClientRect();
      var k=clamp(pinch.k*d/pinch.d,0.1,8),wx=(pinch.cx-r.left-pinch.x)/pinch.k,wy=(pinch.cy-r.top-pinch.y)/pinch.k,cx=(pts[0].x+pts[1].x)/2,cy=(pts[0].y+pts[1].y)/2;
      G.view={k:k,x:cx-r.left-wx*k,y:cy-r.top-wy*k};G.touched=true;applyView();return;
    }
    if(!moved&&Math.hypot(e.clientX-startPt.x,e.clientY-startPt.y)<5)return;
    moved=true;
    if(mode==='node'&&down){
      var w=toWorld(e);down.fx=w.x;down.fy=w.y;
      if(REDUCED){down.x=w.x;down.y=w.y;render()}else reheat(0.3);
    }else if(mode==='pan'){
      G.view.x+=e.clientX-p.x;G.view.y+=e.clientY-p.y;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});G.touched=true;applyView();
    }
  });
  function endPtr(e){
    if(!ptrs.has(e.pointerId))return;
    ptrs.delete(e.pointerId);
    if(e.type==='pointerup'&&!moved&&down&&mode!=='pinch'){
      G.pick=down;nodes.forEach(function(n){n.el.classList.toggle('pick',n===down)});openNote(down.id,false,svg);
    }
    if(down&&down.fx!=null){down.fx=null;down.fy=null}
    if(ptrs.size===0){mode=null;down=null}
    else if(ptrs.size===1){mode='pan';moved=true;var rest=Array.from(ptrs.entries())[0];ptrs.set(rest[0],rest[1])}
  }
  svg.addEventListener('pointerup',endPtr);svg.addEventListener('pointercancel',endPtr);
  svg.addEventListener('pointerleave',function(e){if(e.pointerType==='mouse'&&!ptrs.size)setHover(null,e)});
  svg.addEventListener('wheel',function(e){e.preventDefault();zoomAt(e.clientX,e.clientY,Math.exp(-e.deltaY*(e.deltaMode===1?0.05:0.0016)))},{passive:false});
  svg.addEventListener('keydown',function(e){
    var step=48;
    if(e.key==='+'||e.key==='='){zoomAt(0,0,1.25,true)}
    else if(e.key==='-'||e.key==='_'){zoomAt(0,0,0.8,true)}
    else if(e.key==='0'){G.touched=false;fitView()}
    else if(e.key==='ArrowLeft'){G.view.x+=step;G.touched=true;applyView()}
    else if(e.key==='ArrowRight'){G.view.x-=step;G.touched=true;applyView()}
    else if(e.key==='ArrowUp'){G.view.y+=step;G.touched=true;applyView()}
    else if(e.key==='ArrowDown'){G.view.y-=step;G.touched=true;applyView()}
    else return;
    e.preventDefault();
  });
  search.addEventListener('input',function(){
    G.q=search.value;paintClasses();
    var q=G.q.trim().toLowerCase();
    if(!q){res.textContent='';return}
    var c=nodes.filter(function(n){return n.id.toLowerCase().indexOf(q)>=0||n.desc.toLowerCase().indexOf(q)>=0}).length;
    res.textContent=c?plural(c,'match','matches')+'. Press Enter to open the first.':'No match';
  });
  search.addEventListener('keydown',function(e){
    if(e.key!=='Enter')return;var q=G.q.trim().toLowerCase();if(!q)return;
    var f=nodes.find(function(n){return n.id.toLowerCase().indexOf(q)>=0})||nodes.find(function(n){return n.desc.toLowerCase().indexOf(q)>=0});
    if(f)openNote(f.id,false,search);
  });
  onWidth(wrap,function(){if(!G.touched&&!sim.running)fitView()});
  G.ready=true;
  paintClasses();
}
function fitView(){if(window.fitView&&G.ready)window.fitView()}

/* ================= global wiring ================= */
function init(){
  $('#reload').appendChild(icon('refresh'));
  $('#noteClose').appendChild(icon('close'));
  $('#noteBack').appendChild(icon('back'));
  $('#noteClose').addEventListener('click',closeNote);
  $('#noteBack').addEventListener('click',noteBack);
  $('#noteBackdrop').addEventListener('click',closeNote);
  $('#reload').addEventListener('click',function(){load(true)});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$('#note').hidden){closeNote()}});
  $('#note').addEventListener('keydown',function(e){
    if(e.key!=='Tab')return;
    var f=Array.prototype.filter.call($('#note').querySelectorAll('button,a[href],input,[tabindex]:not([tabindex="-1"])'),function(x){return !x.disabled&&x.offsetParent!==null});
    if(!f.length)return;var a=f[0],z=f[f.length-1];
    if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}
    else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}
  });
  buildTabs();
  window.addEventListener('hashchange',function(){showTab(tabFromHash())});
  if(!TOKEN){showAuth();return}
  showTab(tabFromHash());
  load();
}
init();
})();
</script>
