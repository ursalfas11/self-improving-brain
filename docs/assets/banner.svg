<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="self-improving-brain — your coding agent forgets, this brain gets smarter every session">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#151a3a"/>
      <stop offset="1" stop-color="#2a1245"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7cf7d4"/>
      <stop offset="0.5" stop-color="#8b9bff"/>
      <stop offset="1" stop-color="#f08cff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b9bff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8b9bff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <style>
      .t { font-family: -apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .edge { stroke: #8b9bff; stroke-opacity: .45; stroke-width: 1.6; }
      .node { fill: #c9d1ff; }
      .hot { fill: #7cf7d4; animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .hot2 { animation-delay: .8s; } .hot3 { animation-delay: 1.6s; }
      @keyframes pulse { 0%,100% { opacity: .55; transform: scale(1); } 50% { opacity: 1; transform: scale(1.6); } }
      .draw { stroke-dasharray: 700; stroke-dashoffset: 0; animation: draw 3.2s ease-out .4s backwards; }
      @keyframes draw { from { stroke-dashoffset: 700; } to { stroke-dashoffset: 0; } }
      @media (prefers-reduced-motion: reduce) { .draw, .hot { animation: none; } }
    </style>
  </defs>

  <rect width="1280" height="420" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="24" fill="url(#grid)"/>

  <!-- brain as a knowledge graph -->
  <g transform="translate(170 210)">
    <circle r="150" fill="url(#glow)"/>
    <path d="M-92,-30 C-118,-92 -48,-128 -10,-104 C10,-140 88,-128 92,-74 C140,-62 140,8 104,26 C124,70 76,112 34,96 C10,128 -58,124 -70,86 C-124,84 -136,8 -92,-30 Z"
          fill="none" stroke="url(#accent)" stroke-width="3" stroke-linejoin="round" opacity=".9"/>
    <path d="M-6,-100 C-20,-50 20,-30 0,10 C-18,46 16,70 4,100" fill="none" stroke="url(#accent)" stroke-width="2" opacity=".5"/>
    <g class="edge">
      <line x1="-70" y1="-40" x2="-28" y2="-62"/><line x1="-28" y1="-62" x2="30" y2="-70"/>
      <line x1="30" y1="-70" x2="70" y2="-30"/><line x1="70" y1="-30" x2="40" y2="10"/>
      <line x1="40" y1="10" x2="80" y2="50"/><line x1="-70" y1="-40" x2="-50" y2="20"/>
      <line x1="-50" y1="20" x2="-10" y2="40"/><line x1="-10" y1="40" x2="40" y2="10"/>
      <line x1="-10" y1="40" x2="-30" y2="80"/><line x1="-28" y1="-62" x2="-10" y2="40"/>
      <line x1="30" y1="-70" x2="40" y2="10"/><line x1="-30" y1="80" x2="30" y2="72"/>
      <line x1="30" y1="72" x2="80" y2="50"/>
    </g>
    <circle class="node" cx="-70" cy="-40" r="5"/><circle class="node" cx="-28" cy="-62" r="5"/>
    <circle class="node" cx="70" cy="-30" r="5"/><circle class="node" cx="80" cy="50" r="5"/>
    <circle class="node" cx="-50" cy="20" r="5"/><circle class="node" cx="-30" cy="80" r="5"/>
    <circle class="node" cx="30" cy="72" r="5"/>
    <circle class="hot" cx="30" cy="-70" r="6"/>
    <circle class="hot hot2" cx="-10" cy="40" r="6"/>
    <circle class="hot hot3" cx="40" cy="10" r="6"/>
  </g>

  <!-- title -->
  <text class="t" x="360" y="150" font-size="64" font-weight="800" fill="#ffffff" letter-spacing="-1.5">self-improving-brain</text>
  <text class="t" x="362" y="198" font-size="25" fill="#c9d1ff">Your coding agent forgets everything between sessions.</text>
  <text class="t" x="362" y="232" font-size="25" font-weight="700" fill="url(#accent)">This brain gets smarter with every one.</text>

  <!-- chips -->
  <g class="m" font-size="15" fill="#e8ebff">
    <g transform="translate(362 270)"><rect width="132" height="34" rx="17" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".15"/><text x="66" y="22" text-anchor="middle">Claude Code</text></g>
    <g transform="translate(504 270)"><rect width="84" height="34" rx="17" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".15"/><text x="42" y="22" text-anchor="middle">Codex</text></g>
    <g transform="translate(598 270)"><rect width="118" height="34" rx="17" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".15"/><text x="59" y="22" text-anchor="middle">Gemini CLI</text></g>
    <g transform="translate(726 270)"><rect width="84" height="34" rx="17" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".15"/><text x="42" y="22" text-anchor="middle">Cursor</text></g>
    <g transform="translate(820 270)"><rect width="72" height="34" rx="17" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".15"/><text x="36" y="22" text-anchor="middle">Grok</text></g>
    <g transform="translate(902 270)"><rect width="78" height="34" rx="17" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".15"/><text x="39" y="22" text-anchor="middle">Aider</text></g>
  </g>
  <text class="m" x="362" y="350" font-size="16" fill="#9aa3d6">no server · no API key · no vector DB · zero dependencies · plain Markdown</text>

  <!-- mistakes curve -->
  <g transform="translate(1030 110)">
    <text class="m" x="0" y="0" font-size="13" fill="#9aa3d6">mistakes / 100 msgs</text>
    <line x1="0" y1="150" x2="200" y2="150" stroke="#ffffff" stroke-opacity=".2"/>
    <path class="draw" d="M0,22 C30,30 40,60 70,70 C100,80 110,105 140,112 C165,118 180,128 200,132" fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="22" r="5" fill="#f08cff"/><circle cx="200" cy="132" r="5" fill="#7cf7d4"/>
    <text class="m" x="0" y="172" font-size="13" fill="#9aa3d6">week 1</text>
    <text class="m" x="200" y="172" font-size="13" fill="#9aa3d6" text-anchor="end">week 8</text>
  </g>
</svg>
