[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "self-improving-brain"
version = "0.2.0"
description = "A self-improving memory for coding agents (Claude Code, Codex, Gemini, Cursor, Aider): every night it turns your corrections into rules, on its own. Local, no server, no API key, no dependencies."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
keywords = ["ai-agent", "memory", "claude-code", "codex", "llm", "second-brain", "obsidian", "agents-md", "self-improving"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Topic :: Software Development",
  "Intended Audience :: Developers",
]

[project.scripts]
brain = "self_improving_brain.cli:main"

[tool.setuptools]
packages = ["self_improving_brain"]

[tool.setuptools.package-data]
self_improving_brain = [
  "templates/commands/*.md",
  "ui.html",
  "ui_demo.json",
  "templates/vault/*/*.md",
  "templates/vault/.gitignore",
  "templates/vault/*/.gitkeep",
]
