name: CI
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - name: smoke
        run: |
          export HOME=$RUNNER_TEMP/home BRAIN_VAULT=$RUNNER_TEMP/vault
          ./brain init $BRAIN_VAULT --git
          ./brain lint
          ./brain search "how do lessons work"
          ./brain doctor
